<html lang="ru">

<style>
:root{--ink:#1d1d2b;--bg:#262a52;--panel:#323873;--panel2:#3d4489;--gold:#ffc93c;--gold2:#ff9f1c;--red:#ff5d6c;--red2:#d63a4a;--teal:#2ee6a6;--teal2:#14b37f;--blue:#4da3ff;--blue2:#2b6fd6;--purple:#a98bff;--purple2:#7357e0;--grey:#e3e8f2;--grey2:#aab3c5;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:radial-gradient(circle at 30% 20%,#353b78,#1e2146 70%);color:#fff;font-family:Rubik,"Trebuchet MS",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{display:grid;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "stage" "side"}
@media (min-aspect-ratio:5/4){#app{grid-template-columns:minmax(0,1fr) 310px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "stage side"}}
header{grid-area:head;display:flex;align-items:center;gap:6px;padding:7px 9px;flex-wrap:wrap;background:linear-gradient(180deg,#3d4489,#2f356f);box-shadow:0 4px 0 #1b1f45,0 8px 18px rgba(0,0,0,.25);z-index:3}
#stage{grid-area:stage;position:relative;min-height:0;background:#22263f;touch-action:none;overflow:hidden}
#side{grid-area:side;background:linear-gradient(180deg,#363c7d,#2b3068);padding:9px;display:flex;flex-direction:column;gap:8px;overflow:auto;box-shadow:-4px 0 0 #1b1f45 inset}
@media (max-aspect-ratio:5/4){#side{box-shadow:0 -4px 0 #1b1f45;padding:7px;gap:6px;max-height:44vh}}
.chip{background:rgba(15,17,40,.55);padding:6px 10px;font-size:12px;font-weight:700;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.bar{display:inline-block;width:58px;height:8px;background:#151834;border-radius:99px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8ea2ff,#c5b3ff);width:0;border-radius:99px;transition:width .3s}
#chp{background:linear-gradient(90deg,#2ee6a6,#9bffcf)!important}#ehp{background:linear-gradient(90deg,#ff5d6c,#ffa0a8)!important}
#runInfo{display:inline-flex;gap:6px;flex-wrap:wrap}.hide{display:none!important}
.sp{flex:1}
canvas#cv{display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.px{--c1:var(--grey);--c2:var(--grey2);font-weight:800;font-size:13px;color:var(--ink);border:3px solid var(--ink);padding:10px 12px;border-radius:14px;line-height:1.15;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 45%),var(--c1);box-shadow:0 5px 0 var(--ink),0 7px 12px rgba(0,0,0,.25),inset 0 -4px 0 var(--c2);
  transform:translateY(0);transition:transform .16s cubic-bezier(.3,1.7,.5,1),box-shadow .16s cubic-bezier(.3,1.7,.5,1),filter .15s;position:relative}
.px:hover{filter:brightness(1.07);transform:translateY(-2px);box-shadow:0 7px 0 var(--ink),0 10px 16px rgba(0,0,0,.25),inset 0 -4px 0 var(--c2)}
.px:active{transform:translateY(5px) scale(.98);box-shadow:0 0 0 var(--ink),0 2px 4px rgba(0,0,0,.2),inset 0 -2px 0 var(--c2);transition-duration:.05s}
.px:disabled{filter:grayscale(.7) brightness(.8);pointer-events:none}
.boing{animation:boing .38s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{scale:1}30%{scale:.92 1.06}60%{scale:1.05 .96}100%{scale:1}}
.sm{padding:6px 9px!important;font-size:14px!important;border-radius:11px!important}
.gold{--c1:var(--gold);--c2:var(--gold2)}.red{--c1:var(--red);--c2:var(--red2);color:#fff}.teal{--c1:var(--teal);--c2:var(--teal2)}.blue{--c1:var(--blue);--c2:var(--blue2);color:#fff}.purple{--c1:var(--purple);--c2:var(--purple2);color:#fff}.grey{--c1:var(--grey);--c2:var(--grey2)}
.big{font-size:17px;padding:14px 18px;width:100%;margin-top:14px}
#shop{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media (max-aspect-ratio:5/4){#shop{grid-template-columns:repeat(4,1fr)}}
.card{--c1:#454d9c;--c2:#353b7a;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 50%),var(--c1);color:#fff;border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;gap:7px;padding:6px;font-size:12px;font-weight:700;line-height:1.2;text-align:left;
  box-shadow:0 4px 0 var(--ink),inset 0 -3px 0 var(--c2);transition:transform .16s cubic-bezier(.3,1.7,.5,1),box-shadow .16s}
.card:hover{transform:translateY(-2px)}.card:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink),inset 0 -2px 0 var(--c2);transition-duration:.05s}
.card canvas{width:38px;height:38px;image-rendering:auto;flex:none;background:radial-gradient(circle,#8fd16a,#4f9a33);border:2px solid var(--ink);border-radius:9px}
.card.sel{--c1:var(--gold);--c2:var(--gold2);color:var(--ink);transform:translateY(-3px) rotate(-1deg)}
@media (max-aspect-ratio:5/4){.card{flex-direction:column;text-align:center;padding:5px 2px;font-size:10px}.card canvas{width:30px;height:30px}}
.card.wide{grid-column:1/-1;justify-content:center;font-size:13px;padding:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-aspect-ratio:5/4){.actions{grid-template-columns:repeat(4,1fr);gap:6px}.px{font-size:11px;padding:8px 6px}}
#bFight{font-size:17px;grid-column:1/-1;padding:13px}
#bTrash.hot{--c1:#ff2d3d;transform:scale(1.15) rotate(-6deg)}
body.running #shop,body.running #bMerge,body.running #bTrash,body.running #bClear,body.running #bFill,body.running #bGuide,body.running #bSetup{opacity:.4;pointer-events:none;filter:grayscale(.5)}
body.running #bFight{--c1:var(--red);--c2:var(--red2);color:#fff}
body.nomode #side,body.nomode #runInfo,body.nomode #bSetup{visibility:hidden}
.hint{font-size:11px;line-height:1.55;color:#c8cff5;font-weight:500}
@media (max-aspect-ratio:5/4){.hint{display:none}}
#zoomBox{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:8px;z-index:4;align-items:center}
#zoomBox .px{width:42px;height:42px;padding:0!important;font-size:18px!important}
#zLvl{font-size:10px;font-weight:800;background:rgba(15,17,40,.7);padding:3px 6px;border-radius:99px}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-40px) scale(.9);background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:700;line-height:1.4;opacity:0;
  transition:all .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;width:max-content;max-width:92%;text-align:center;z-index:6;box-shadow:0 5px 0 var(--ink)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(60,66,140,.92),rgba(14,16,38,.96));padding:12px}
#scr[hidden]{display:none}
#scrBox{width:min(760px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#3d4489,#2f356f);border:4px solid var(--ink);border-radius:24px;padding:18px;box-shadow:0 8px 0 var(--ink),0 20px 50px rgba(0,0,0,.45)}
#scr.show #scrBox{animation:popIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{0%{transform:scale(.85) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
.menu{text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;margin:4px 0 18px;font-weight:900;line-height:.95;letter-spacing:1px;animation:float 3s ease-in-out infinite}
.logo span{font-size:clamp(30px,7vw,54px);background:linear-gradient(180deg,#fff6c8,#ffc93c 55%,#ff8a1c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px var(--ink);filter:drop-shadow(0 5px 0 var(--ink))}
.logo span+span{font-size:clamp(36px,9vw,66px)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.mcard{--c1:#4b55b0;--c2:#3a4290;border:4px solid var(--ink);border-radius:20px;padding:16px 12px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 45%),var(--c1);box-shadow:0 6px 0 var(--ink),inset 0 -5px 0 var(--c2);transition:transform .2s cubic-bezier(.3,1.7,.5,1),box-shadow .2s;animation:cardIn .5s cubic-bezier(.3,1.5,.5,1) backwards}
.mcard:nth-child(2){animation-delay:.06s}.mcard:nth-child(3){animation-delay:.12s}.mcard:nth-child(4){animation-delay:.18s}
@keyframes cardIn{0%{transform:translateY(30px) scale(.8);opacity:0}}
.mcard:hover{transform:translateY(-5px) rotate(-1deg)}.mcard:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 var(--c2);transition-duration:.05s}
.mcard em{font-style:normal;display:block;width:64px;height:64px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}.bigic{width:100%;height:100%;display:block}.mcard b{font-size:19px;font-weight:900;text-shadow:0 2px 0 var(--ink)}.mcard small{font-size:12px;line-height:1.35;opacity:.95;font-weight:500}
.c1{--c1:#ff8f3c;--c2:#d9661c}.c2{--c1:#2fc0e8;--c2:#1b8fb8}.c3{--c1:#ff5d8f;--c2:#d63a6a}.c4{--c1:#33d17a;--c2:#1f9e58}
.mstats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}.mstats span{background:rgba(15,17,40,.45);padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sh h2{flex:1;font-size:22px;font-weight:900;text-align:center;text-shadow:0 3px 0 var(--ink)}.coins{font-weight:800;background:rgba(15,17,40,.5);padding:6px 12px;border-radius:99px}
.hint2{font-size:13px;line-height:1.5;color:#d4daff;margin:4px 0 8px;font-weight:500}
.sec{font-size:13px;font-weight:800;color:#ffd96b;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.5px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.opts.two{grid-template-columns:1fr 1fr}.agrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:240px;overflow:auto;padding:3px}
.opt{--c1:#454d9c;--c2:#353b7a;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,0) 50%),var(--c1);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:9px;text-align:left;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 4px 0 var(--ink),inset 0 -3px 0 var(--c2);transition:transform .16s cubic-bezier(.3,1.7,.5,1),box-shadow .16s}
.opt:hover{transform:translateY(-2px)}.opt:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink);transition-duration:.05s}
.opt b{font-size:14px;font-weight:800}.opt small{font-size:11.5px;line-height:1.4;opacity:.9;font-weight:500}
.opt.sel{--c1:var(--gold);--c2:var(--gold2);color:var(--ink)}
.aicon{width:96px;height:32px;image-rendering:auto;background:radial-gradient(circle,#8fd16a,#4f9a33);border:2px solid var(--ink);border-radius:8px}
.sw2{display:block;height:12px;border:2px solid var(--ink);border-radius:6px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ucard{--c1:#4b55b0;--c2:#3a4290;border:3px solid var(--ink);border-radius:16px;padding:10px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 50%),var(--c1);
  box-shadow:0 5px 0 var(--ink),inset 0 -4px 0 var(--c2);transition:transform .16s cubic-bezier(.3,1.7,.5,1)}
.ucard:hover{transform:translateY(-3px)}.ucard:active{transform:translateY(4px);transition-duration:.05s}
.ucard.locked{--c1:#3a3f63;--c2:#2c3050;filter:saturate(.6)}.ucard.done{--c1:#2fae6e;--c2:#1f8752}
.ucard b{font-size:15px;font-weight:800}.ucard small{font-size:12px;opacity:.85}.uic{display:flex;align-items:center;gap:6px;font-weight:900}.uic .aicon{width:38px;height:38px}.uic .ico{width:22px;height:22px}
.ulock{font-size:12px;font-weight:800;color:#ffe08a}.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;background:#1d1f40;border:2px solid var(--ink)}.dots i.on{background:var(--gold)}
.lvrow{display:flex;gap:8px;flex-wrap:wrap}.lv{width:58px;height:58px;border:3px solid var(--ink);border-radius:16px;background:#454d9c;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--ink);transition:transform .16s cubic-bezier(.3,1.7,.5,1)}
.lv b{font-size:22px;font-weight:900}.lv small{font-size:11px}.lv.done{background:#2fae6e}.lv.sel{background:var(--gold);color:var(--ink);transform:translateY(-3px) scale(1.06)}.lv.locked{background:#2c3050;opacity:.7}.lv:active{transform:translateY(4px)}
.toggle{margin-top:10px;font-size:13px;font-weight:700;background:rgba(15,17,40,.4);padding:10px;border-radius:12px}.toggle input{transform:scale(1.3);margin-right:8px;accent-color:#ffc93c}
.infobox{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.infobox span{background:rgba(15,17,40,.45);padding:8px 12px;border-radius:12px;font-size:13px;font-weight:600}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;flex:1;min-width:150px}
.fld input,.fld select{font-family:inherit;font-size:15px;font-weight:600;padding:9px 11px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.fld input[type=range]{padding:0;box-shadow:none;border:none;accent-color:#ffc93c;background:transparent}
.picrow{display:flex;gap:12px;align-items:center}.picrow canvas{width:110px;height:110px;image-rendering:auto;background:#1d1f40;border:3px solid var(--ink);border-radius:14px;flex:none}.piccol{display:flex;flex-direction:column;gap:8px;flex:1}
.pinfo{font-size:12px;line-height:1.5;color:#c8cff5;margin-top:6px}
.handoff,.result{text-align:center;padding:10px}.handoff em,.result em{font-style:normal;width:96px;height:96px;margin:0 auto;display:block;animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}.handoff em .ico,.result em .ico{width:96px;height:96px}.result.draw h2{color:#ffb3dd}
.handoff h2,.result h2{font-size:26px;font-weight:900;margin:8px 0 12px;text-shadow:0 3px 0 var(--ink)}.result.win h2{color:#ffd96b}.result.lose h2{color:#ff9aa5}
.handoff p,.result p{font-size:15px;line-height:1.6;margin:4px 0}.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
#shop.pix{display:block}
.fbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.fchip{font-size:11px;font-weight:700;padding:5px 8px;border:2px solid var(--ink);border-radius:99px;background:#454d9c;color:#fff;display:inline-flex;align-items:center;gap:5px;box-shadow:0 3px 0 var(--ink);transition:transform .14s cubic-bezier(.3,1.7,.5,1)}
.fchip:active{transform:translateY(3px);box-shadow:none}.fchip i{display:inline-block;width:11px;height:11px;border:2px solid var(--ink);border-radius:50%}.fchip.sel{background:var(--gold);color:var(--ink)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px;max-height:32vh;overflow:auto;padding:3px}
.sw button{aspect-ratio:1;border:2px solid var(--ink);border-radius:9px;padding:0;position:relative;background:#1d1d22;overflow:hidden;box-shadow:0 3px 0 var(--ink);transition:transform .14s cubic-bezier(.3,1.7,.5,1)}
.sw button:active{transform:translateY(3px);box-shadow:none}.sw button.sel{outline:3px solid var(--gold);outline-offset:1px;transform:scale(1.1);z-index:1}.sw button.done{opacity:.45}
.sw button.done::after{content:'';position:absolute;right:4px;bottom:5px;width:5px;height:9px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);filter:drop-shadow(1px 1px 0 #000)}
.sw canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.trow{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}.trow button{border:2px solid var(--ink);border-radius:9px;background:#454d9c;padding:2px;box-shadow:0 3px 0 var(--ink)}.trow button.sel{background:var(--gold)}
.trow canvas{width:100%;image-rendering:pixelated;display:block}.pinfo2{font-size:12px;line-height:1.5;margin-top:7px;color:#d4daff;font-weight:600}
@media (max-aspect-ratio:5/4){.sw{max-height:15vh;grid-template-columns:repeat(auto-fill,minmax(28px,1fr))}.fchip{font-size:9.5px;padding:4px 6px}}
@media (max-width:560px){header{gap:5px;padding:6px 7px}header .px.sm{min-width:36px;min-height:36px;padding:4px!important}header .px.sm .ico{width:20px;height:20px}#runInfo{order:9;width:100%;gap:5px}.lvchip{display:none}#modeChip{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis}body.running #modeChip,body.running #army,body.running #bSetup,body.running #moneyChip{display:none}.chip{font-size:10.5px;padding:5px 8px}.bar{width:40px}#modeChip{max-width:60vw;overflow:hidden;text-overflow:ellipsis}#scrBox{padding:12px;border-radius:18px}.opts.two{grid-template-columns:1fr}}

.ico{width:1.3em;height:1.3em;vertical-align:-.3em;flex:none;display:inline-block;overflow:visible}
.px .ico{filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
.px.sm .ico{width:22px;height:22px;vertical-align:middle}
.px.sm{min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.chip .ico{width:17px;height:17px}
.ico.huge{width:64px;height:64px}
.opt .opti{width:30px;height:30px}
.stars .ico{width:14px;height:14px;margin-right:-2px}
.infobox .ico{width:18px;height:18px}
.urk{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#d8defa;margin-top:2px}.urk .ico{width:18px;height:18px}
.ulock{display:flex;align-items:center;gap:4px}.ulock .ico{width:16px;height:16px}
.lv small .ico{width:16px;height:16px}
#zoomBox .px .ico{width:22px;height:22px}
/* вкладки */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;background:rgba(15,17,40,.55);border:3px solid var(--ink);border-radius:14px;padding:3px;box-shadow:inset 0 3px 0 rgba(0,0,0,.3)}
.tabs button{border:0;background:transparent;color:#cfd6ff;font-weight:800;font-size:13px;padding:8px 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s,transform .16s cubic-bezier(.3,1.7,.5,1)}

/* лимиты */
#limits{background:linear-gradient(180deg,#4a52a8,#3b4290);border:3px solid var(--ink);border-radius:16px;padding:9px 10px;box-shadow:0 4px 0 var(--ink),inset 0 -3px 0 #2e3478}
.limtop{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800}.limtop .ico{width:24px;height:24px}.limnum{margin-left:auto;font-size:15px;font-weight:700;color:#fff}.limnum b{font-size:24px;font-weight:900;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink)}
.limbar{position:relative;height:20px;margin:7px 0 5px;background:#171a3b;border:3px solid var(--ink);border-radius:99px;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.4)}
.limbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),var(--lc);transition:width .45s cubic-bezier(.3,1.5,.5,1),background .3s}
.limbar s{position:absolute;top:3px;bottom:3px;width:2px;background:rgba(0,0,0,.25);border-radius:2px}
.limsub{font-size:11px;line-height:1.35;color:#d4daff;font-weight:600}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.tier{display:flex;align-items:center;justify-content:center;gap:4px;background:rgba(15,17,40,.45);border-radius:10px;padding:4px 2px;font-weight:900;font-size:14px}
.tier em{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:2px solid var(--ink);color:var(--ink)}
.tier.zero{opacity:.45}
.t1 em,.lvls .t1{background:#cfd6e4}.t2 em,.lvls .t2{background:#7dd3fc}.t3 em,.lvls .t3{background:#86efac}.t4 em,.lvls .t4{background:#c4b5fd}.t5 em,.lvls .t5{background:#ffd23f}
.card{position:relative}.card .lvls{position:absolute;right:4px;top:-9px;background:#1d1f40;border:2px solid var(--ink);border-radius:99px;padding:1px 6px 1px 3px;font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;gap:2px;white-space:nowrap}
.lvls i{font-style:normal;display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;color:var(--ink);font-size:9px;font-weight:900;border:1.5px solid var(--ink)}
#shop{padding-top:6px}
/* анализ */
#anal{display:flex;flex-direction:column;gap:8px}
.anbox{background:linear-gradient(180deg,#4a52a8,#3b4290);border:3px solid var(--ink);border-radius:16px;padding:10px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:8px}
.gwrap{text-align:center}.gwrap small{display:block;font-size:11px;color:#d4daff;font-weight:600}.gauge{width:170px;max-width:100%;display:block;margin:0 auto}
.glbl{font-size:18px;font-weight:900;text-shadow:0 2px 0 var(--ink);margin-top:-4px}.blindg{padding:8px 0}
.cmph{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:4px}.cmph .me{color:#7ef0c4}.cmph .foe{color:#ff9aa5}
.cmpr{margin-bottom:6px}.cmpr small{font-size:11px;font-weight:700;color:#e6e9ff}
.cb{position:relative;height:13px;background:#171a3b;border:2px solid var(--ink);border-radius:99px;margin-top:2px;overflow:hidden}
.cb i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}.cb i.me{background:linear-gradient(90deg,#14b37f,#7ef0c4)}.cb i.foe{background:linear-gradient(90deg,#d63a4a,#ff9aa5)}
.cb em{position:absolute;right:6px;top:-2px;font-style:normal;font-size:10px;font-weight:900;text-shadow:0 1px 0 #000}
.tips{display:flex;flex-direction:column;gap:6px}
.tipr{display:flex;gap:8px;align-items:flex-start;background:rgba(15,17,40,.45);border-left:5px solid;border-radius:10px;padding:7px 9px;font-size:12px;line-height:1.4;font-weight:600}
.tipr .ico{width:20px;height:20px;flex:none}.tipr.bad{border-color:#ff5d6c}.tipr.warn{border-color:#ffb13c}.tipr.tip{border-color:#ffd23f}.tipr.good{border-color:#2ee6a6}.tipr.info{border-color:#9fb4ff}
.hint3{font-size:11px;color:#ffb3bb;font-weight:600;text-align:center}
/* ракеты */
body.running #shop,body.running #tabs,body.running #limits,body.running #anal,body.running #bMerge,body.running #bTrash,body.running #bClear,body.running #bFill,body.running #bGuide{display:none!important}
body.running .actions{grid-template-columns:1fr}body.running .hint{display:none}
#rkBar{background:linear-gradient(180deg,#4a52a8,#353b7a);border:3px solid var(--ink);border-radius:18px;padding:9px;box-shadow:0 5px 0 var(--ink),inset 0 -4px 0 #2a2f6c;display:flex;flex-direction:column;gap:8px}
.rktitle{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:900}.rktitle .ico{width:24px;height:24px}
.rkcnt{margin-left:auto;background:rgba(15,17,40,.6);padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}.rkcnt .ico{width:16px;height:16px}
.rkrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rkb{aspect-ratio:1;width:100%;border-radius:50%;border:3px solid var(--ink);padding:0;position:relative;background:radial-gradient(circle at 35% 30%,#6f79d6,#2b3068 72%);box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.25);transition:transform .16s cubic-bezier(.3,1.7,.5,1),box-shadow .16s}
.rkb canvas{width:84%;height:84%;display:block;margin:8% auto 0}
.rkb:hover{transform:translateY(-3px) rotate(-5deg)}.rkb:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.rkb.sel{background:radial-gradient(circle at 35% 30%,#fff1a8,#ffc93c 72%);transform:translateY(-3px) scale(1.05)}
.rkb.locked{filter:grayscale(.95) brightness(.65)}
.rklv{position:absolute;right:-4px;bottom:-4px;font-style:normal;width:21px;height:21px;border-radius:50%;background:#ffd23f;color:var(--ink);border:2.5px solid var(--ink);font-size:12px;font-weight:900;display:grid;place-items:center}
.rklock{position:absolute;right:-3px;bottom:-3px;width:21px!important;height:21px!important}
.rkinfo{font-size:11.5px;line-height:1.4;color:#e1e5ff;font-weight:600}.rkinfo b{color:#fff}.rkinfo span{color:#ffe08a}
.rklvs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.rklvs button{height:32px;border:2.5px solid var(--ink);border-radius:10px;background:#2b3068;color:#fff;font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;transition:transform .14s cubic-bezier(.3,1.7,.5,1)}
.rklvs button:active{transform:translateY(3px);box-shadow:none}.rklvs button.sel{background:#ffd23f;color:var(--ink)}.rklvs button.off{opacity:.5}.rklvs .ico{width:15px;height:15px}
.rkgo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rkgo .px{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 6px;font-size:14px}
.rknone{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:600;color:#c8cff5}.rknone .ico{width:28px;height:28px}
#aimBan{position:absolute;left:50%;top:8px;white-space:nowrap;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:5px 6px 5px 10px;font-size:13px;font-weight:800;box-shadow:0 5px 0 var(--ink);max-width:94%;animation:popIn .3s cubic-bezier(.3,1.5,.5,1)}
#aimBan>.ico{width:24px;height:24px;animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
body.aiming #cv{cursor:crosshair}
@media (max-aspect-ratio:5/4){#rkBar{padding:7px;gap:6px}.rkrow{width:min(100%,300px);margin:0 auto}.rkinfo{font-size:10.5px}.rkgo .px{padding:9px 6px;font-size:13px}.tabs button{padding:6px}#limits{padding:7px 8px}.limbar{height:16px;margin:5px 0 4px}.limsub{display:none}.tiers{margin-top:5px}.tier{font-size:12px;padding:2px}.card .lvls{top:-8px;right:2px;font-size:9px}#zoomBox .px{width:38px;height:38px}}
.rkun{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px auto 0;background:rgba(15,17,40,.45);border:3px solid var(--ink);border-radius:16px;padding:9px 14px;max-width:420px;font-size:15px;font-weight:800;color:#ffe08a;animation:popIn .6s .3s cubic-bezier(.3,1.5,.5,1) backwards}.rkun .ico{width:40px;height:40px;animation:float 2s ease-in-out infinite}
.big.sticky{position:sticky;bottom:-18px;z-index:2;box-shadow:0 5px 0 var(--ink),0 -12px 18px rgba(30,34,80,.85),inset 0 -4px 0 var(--c2)}
.sh .px{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}.coins{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
@media (max-width:560px){.sh{gap:6px}.sh h2{font-size:17px}.sh .px{padding:7px 8px;font-size:12px}.coins{padding:5px 9px;font-size:13px}.big.sticky{bottom:-12px}body.haslim #army{display:none}}
#iosTip{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;width:min(420px,calc(100% - 20px));background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:11px 12px;box-shadow:0 6px 0 var(--ink);display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600;line-height:1.4;animation:popIn .4s cubic-bezier(.3,1.5,.5,1)}
#iosTip svg.shr{width:30px;height:30px;flex:none}#iosTip b{font-weight:900}#iosTip button{margin-left:auto;flex:none}
</style>
</head>

<script>
const PAL_BASE={k:'#1d1d22',e:'#1d1d22',l:'#5a3a1e',p:'#3a3f55',b:'#4a2f1a',w:'#9b6a3a',m:'#cfd6df',M:'#8b95a3',g:'#f5c542',r:'#e04a3a',G:'#3f8f4a',P:'#7d4bc2',Q:'#5a3296',c:'#5de0ff',W:'#ffffff',H:'#e9e2d4',D:'#b7a98f',K:'#2a2a33',B:'#9fd8ff',N:'#2e5c9a',Y:'#8af5a0',O:'#e8e4da',S:'#9aa3ad',Z:'#6b737d'};
const ACCENT=['#9b6a3a','#a7b0bd','#eef2f6','#f5c542','#5de0ff'];
const PAL_TEAM={ally:{s:'#f2c39b',h:'#7a4a24',t:'#3b7ddd',T:'#2a5cab'},enemy:{s:'#7bbf4a',h:'#2f3d1e',t:'#d64541',T:'#9e2c2a'}};
const LINES=['melee','ranged','tower','sniper','barricade','healer','mortar','frost'];
const TITLES={melee:'Ближний бой',ranged:'Дальний бой',tower:'Башня',sniper:'Стрелок',barricade:'Баррикада',healer:'Лекарь',mortar:'Мортира',frost:'Ледяной маг'};
const NAMES={
  melee:['Ополченец','Мечник','Щитоносец','Рыцарь','Всадник'],
  ranged:['Лучник','Арбалетчик','Мушкетёр','Маг','Архимаг'],
  tower:['Вышка','Башня','Бастион','Цитадель','Небесная башня'],
  sniper:['Охотник','Стрелок','Снайпер','Мастер-снайпер','Легенда'],
  barricade:['Плетень','Частокол','Каменная стена','Шипастая стена','Железная крепь'],
  healer:['Знахарь','Лекарь','Целитель','Жрица','Архижрец'],
  mortar:['Мортира','Пушка','Бомбарда','Осадное орудие','Громовержец'],
  frost:['Ученик холода','Ледяной маг','Морозный маг','Повелитель льда','Владыка зимы']};

function makeSpriteGrid(line,tier){
  const N=16,g=[...Array(N)].map(()=>Array(N).fill('.'));
  let ox=0,oy=0;
  const P=(x,y,c)=>{x+=ox;y+=oy;if(x>=0&&x<N&&y>=0&&y<N)g[y][x]=c;};
  const R=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)P(x+i,y+j,c);};
  const V=(x,y1,y2,c)=>{for(let y=y1;y<=y2;y++)P(x,y,c);};
  const T=(rows,dx=0,dy=0)=>rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(c!=='.')P(x+dx,y+dy,c);}));
  const base=(legs=true)=>{
    const rows=['............','....hhhh....','...hhhhhh...','...hssssh...','...sesses...','...ssssss...','....ssss....','..tttttttt..','.stttttttts.','.stllllllts.','...tttttt...','...pp..pp...','...pp..pp...','..bbb..bbb..'];
    rows.forEach((r,y)=>{if(!legs&&y>10)return;[...r].forEach((c,x)=>{if(c!=='.')P(x+2,y+1,c);});});
  };
  const cap=c=>{R(6,2,4,1,c);R(5,3,6,1,c);P(5,4,c);P(10,4,c);};
  const sword=top=>{V(13,top,7,'m');P(12,8,'g');P(13,8,'g');P(14,8,'g');V(13,9,10,'w');};
  const knightHead=()=>{R(5,2,6,5,'m');R(6,4,4,1,'k');R(7,0,2,2,'r');R(4,8,8,3,'m');R(7,8,2,4,'t');};
  if(line==='melee'){
    if(tier===1){base();R(13,4,2,3,'w');V(13,7,10,'w');}
    if(tier===2){base();R(5,3,6,1,'r');sword(2);}
    if(tier===3){base();cap('M');sword(4);R(1,8,4,5,'m');R(1,8,4,1,'M');R(2,10,2,1,'g');}
    if(tier===4){base();knightHead();sword(1);}
    if(tier===5){R(2,10,10,3,'H');V(3,13,15,'D');V(5,13,15,'D');V(9,13,15,'D');V(11,13,15,'D');
      R(12,7,3,3,'H');R(11,9,2,2,'H');P(13,8,'k');V(11,7,8,'D');V(1,10,12,'D');R(3,11,8,1,'t');
      ox=-1;oy=-1;base(false);knightHead();ox=0;oy=0;P(11,6,'w');P(12,5,'w');P(13,4,'w');P(14,3,'m');P(15,2,'m');}
  } else if(line==='ranged'){
    if(tier===1){base();cap('G');P(5,5,'G');P(10,5,'G');[[13,4],[14,5],[14,6],[14,7],[14,8],[14,9],[14,10],[13,11]].forEach(([x,y])=>P(x,y,'w'));V(13,5,10,'W');}
    if(tier===2){base();cap('M');R(10,9,5,1,'w');V(14,7,11,'M');}
    if(tier===3){base();R(4,2,8,1,'K');R(6,1,4,1,'K');P(10,0,'r');P(11,1,'r');R(9,8,6,1,'M');R(9,9,2,1,'w');}
    if(tier===4){base();R(5,1,6,3,'P');P(7,0,'P');P(8,0,'P');V(5,4,6,'P');V(10,4,6,'P');R(4,8,8,3,'P');R(7,8,2,3,'t');R(4,12,8,3,'Q');V(13,3,14,'w');R(13,1,2,2,'c');}
    if(tier===5){base();R(6,0,4,1,'P');R(5,1,6,2,'P');R(4,3,8,1,'P');P(8,1,'g');P(7,2,'g');R(6,6,4,2,'W');R(7,8,2,1,'W');R(4,9,8,2,'P');P(4,8,'P');P(11,8,'P');R(4,12,8,3,'Q');R(5,11,6,1,'g');V(13,3,14,'g');R(12,0,3,3,'c');P(13,1,'W');}
  } else if(line==='tower'){
    T(['................','...a.aa.aa.a....','...aaaaaaaaa....','....SSSSSSS.....','....SZSSSZS.....','....SSSkSSS.....','....SSSkSSS.....','....SZSSSZS.....','....SSSSSSS.....','...ttttttttt....','....SSSSSSS.....','....SZSSSZS.....','....SSkkkSS.....','...ZSSkkkSSZ....','..ZZZZZZZZZZZ...','................'],1,0);
    if(tier>=3){P(8,5,'g');P(8,6,'g');}
    if(tier>=4){V(8,0,0,'w');P(9,0,'t');}
    if(tier===5){P(8,5,'c');P(8,6,'c');R(7,13,3,2,'c');}
  } else if(line==='sniper'){
    base();cap('G');R(5,7,6,1,'G');R(6,9,10,1,'K');R(6,10,3,1,'w');R(10,8,3,1,'a');
    if(tier>=4)P(9,2,'a');if(tier===5){P(15,9,'c');}
  } else if(line==='barricade'){
    T(['..a...a...a...','..w...w...w...','.www.www.www..','.www.www.www..','aaaaaaaaaaaaa.','.www.www.www..','.wlw.wlw.wlw..','.www.www.www..','aaaaaaaaaaaaa.','.www.www.www..','bbbbbbbbbbbbb.'],1,4);
    if(tier>=3){P(1,6,'M');P(0,7,'M');P(1,10,'M');P(0,11,'M');P(15,6,'M');P(15,10,'M');}
    if(tier>=4){T(['.a...a...a...a','.M...M...M...M'],1,1);}
    if(tier===5){R(2,8,11,1,'c');}
  } else if(line==='healer'){
    base();cap('W');P(5,5,'W');P(10,5,'W');R(4,8,8,3,'W');R(7,8,2,3,'r');R(6,9,4,1,'r');R(4,12,8,3,'O');V(13,3,14,'w');R(12,1,3,2,'a');P(13,1,'Y');
    if(tier>=4){R(6,0,4,1,'g');}if(tier===5)P(13,0,'Y');
  } else if(line==='mortar'){
    T(['...........KK...','..........KMMK..','.........KMMMK..','........KMMMK...','.......KMMMK....','......KMMMK.....','.....aMMMa......','....aawwwaa.....','...wwwwtwwww....','...wlwwwwwlw....','....ll...ll.....','....ll...ll.....'],0,3);
    if(tier>=3){R(5,13,6,1,'a');}
    if(tier>=4){P(12,3,'r');P(13,2,'g');}
    if(tier===5){P(12,4,'c');P(11,5,'c');}
  } else if(line==='frost'){
    base();R(5,1,6,3,'B');P(7,0,'B');P(8,0,'B');V(5,4,6,'B');V(10,4,6,'B');R(4,8,8,3,'N');R(7,8,2,3,'B');R(4,12,8,3,'N');R(4,11,8,1,'a');
    V(13,4,14,'M');P(13,1,'c');R(12,2,3,1,'c');P(13,3,'W');
    if(tier>=4){P(12,1,'W');P(14,1,'W');}if(tier===5){R(6,0,4,1,'c');}
  }
  const out=g.map(r=>r.slice());
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(g[y][x]!=='.')continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>{const v=g[y+dy]?.[x+dx];return v&&v!=='.'&&v!=='k';}))out[y][x]='k';
  }
  return out;
}

/* ---------- утилиты ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255];}
function rgbHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(hex,f){const[r,g,b]=hexRgb(hex);return rgbHex(r*f,g*f,b*f);}
function vivid(hex){if(!hex||hex[0]!=='#'||hex.length!==7)return hex;let[r,g,b]=hexRgb(hex).map(v=>v/255);
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;const d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360;}
  s=Math.min(1,s*1.28);l=Math.max(0,Math.min(1,0.5+(l-0.5)*1.12));
  const C=(1-Math.abs(2*l-1))*s,X=C*(1-Math.abs((h/60)%2-1)),m=l-C/2;let[R,Gg,B]=h<60?[C,X,0]:h<120?[X,C,0]:h<180?[0,C,X]:h<240?[0,X,C]:h<300?[X,0,C]:[C,0,X];
  return rgbHex((R+m)*255,(Gg+m)*255,(B+m)*255);}
function fmt(n){n=Math.round(n);return n<1e4?String(n):n<1e6?(n/1e3).toFixed(1)+'K':n<1e9?(n/1e6).toFixed(1)+'M':(n/1e9).toFixed(1)+'B';}
function mmss(t){t=Math.floor(t);return String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const remN=(n,s)=>Math.floor(n*0.55*s/STAGES),crackN=(n,s)=>Math.floor(n*0.18*s/STAGES);

/* ---------- конфигурация боя, зоны, крепости ---------- */
const HALF=()=>Math.floor(N/2);

let CAST={ally:null,enemy:null};
function castleRect(team){const w=Math.max(4,Math.round(5*G)),h=Math.max(2,Math.round(2*G)),cx=Math.round(N/2-w/2);
  if(halves())return team==='ally'?{x0:cx,y0:N-h,x1:cx+w,y1:N}:{x0:cx,y0:1,x1:cx+w,y1:1+h};
  const d=S.B?S.B.dir:'top';let x0=cx,y0=N-h;
  if(d==='bottom')y0=0;else if(d==='left'){x0=N-w;y0=Math.round(N/2-h/2);}else if(d==='right'){x0=0;y0=Math.round(N/2-h/2);}else if(d==='all'||d==='waves'){y0=Math.round(N/2-h/2);}
  return{x0,y0,x1:x0+w,y1:y0+h};}
function hasCastle(team){if(!S.B)return false;const b=S.B.btype;if(team==='ally')return b==='endless'||b==='defend'||b==='fortress'||b==='friend';return b==='attack'||b==='fortress'||b==='friend';}
function inRect(c,r,R){return R&&c>=R.x0&&c<R.x1&&r>=R.y0&&r<R.y1;}
function isSpawn(c,r){if(!S.B)return false;if(halves())return r<=HALF()-1;const d=S.B.dir,b=Math.round(4*G),b3=Math.round(3*G);
  if(d==='top')return r<b;if(d==='bottom')return r>=N-b;if(d==='left')return c<b;if(d==='right')return c>=N-b;return r<b3||r>=N-b3||c<b3||c>=N-b3;}
function castleBlock(c,r){for(const t of['ally','enemy']){if(!hasCastle(t))continue;const R=castleRect(t);if(inRect(c,r,R))return true;if(R.y0>0&&r===R.y0-1&&c>=R.x0&&c<R.x1)return true;}return false;}
function canPlace(c,r,team){team=team||S.builder;if(c<0||c>=N||r<0||r>=N||castleBlock(c,r))return false;
  if(halves()){if(team==='ally')return r>=HALF()+1;return r<=HALF()-1;}return !isSpawn(c,r);}
function MODS(){if(!S.B)return{};if(S.B.mode==='sand'&&KIT.enemy.type==='orc')return LOCS[curLoc].mods;if(S.B.mode==='photo'&&S.B.btype==='endless')return LOCS[curLoc].mods;return{};}
function applyBattle(){const B=S.B;KIT.ally=armyById(B.kitA);KIT.enemy=armyById(B.kitB);curLoc=B.loc;setGrid(B.detail||25);clearSprites();
  CAST={ally:null,enemy:null};if(W)buildBg();cam.z=cam.tz=1;cam.x=cam.tx=AW/2;cam.y=cam.ty=AH/2;camInit=false;if(W)layout();}

/* ---------- раскладка и камера ---------- */
let scale=1,offX=0,offY=0,dpr=1,baseS=1,W=0,H=0,camInit=false;const cam={z:1,x:AW/2,y:AH/2,tz:1,tx:AW/2,ty:AH/2};
function layout(){const r=stage.getBoundingClientRect();if(r.width<10||r.height<10)return;W=r.width;H=r.height;baseS=Math.min(W/AW,H/AH);
  dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';

function applyCam(){const t={z:cam.tz,x:cam.tx,y:cam.ty};clampCam(t);cam.tz=t.z;cam.tx=t.x;cam.ty=t.y;clampCam(cam);scale=baseS*cam.z;offX=W/2-cam.x*scale;offY=H/2-cam.y*scale;
  const zl=$('zLvl');if(zl)zl.textContent='x'+cam.tz.toFixed(1);}

  if(instant){cam.z=cam.tz;cam.x=cam.tx;cam.y=cam.ty;}applyCam();}

    b.fillStyle='rgba(0,0,0,0.18)';if(dy)b.fillRect(c*CS,(dy>0?r*CS+CS-2:r*CS),CS,2);else b.fillRect((dx>0?c*CS+CS-2:c*CS),r*CS,2,CS);});}
  const free=(x,y)=>!isSpawn(x/CS|0,y/CS|0);
  for(let i=0;i<AW*AH*0.0028;i++){const x=R()*AW,y=R()*AH,inZ=!free(x,y),k=R();
    if(L.decor==='meadow'){if(inZ)continue;if(k<0.55){b.fillStyle=shade(g[2],0.8);for(let j=0;j<3;j++){b.beginPath();b.ellipse(x+j*1.6,y,0.7,2.4,(j-1)*0.4,0,6.283);b.fill();}}

/* ---------- поле потоков к замку ---------- */
function rebuildHeroGrid(){heroGrid.fill(null);for(const h of heroes)if(h.alive&&h.team==='ally')heroGrid[h.r*N+h.c]=h;}
function computeFlow(){
  rebuildHeroGrid();const INF=1e9;flow.fill(INF);const done=new Uint8Array(N*N);const R=CAST.ally;if(!R)return;

/* ---------- бот строит армию ---------- */
function botBuild(budget,style,seed){const R=rng(seed||1),list=[],taken=new Set();
  const w=style==='def'?{tower:18,barricade:16,ranged:20,melee:16,sniper:8,mortar:8,healer:7,frost:7}:{melee:28,ranged:22,tower:8,barricade:6,sniper:9,mortar:9,healer:9,frost:9};
  const keys=Object.keys(w),tot=keys.reduce((a,k)=>a+w[k],0),pick=()=>{let r=R()*tot;for(const k of keys){r-=w[k];if(r<=0)return k;}return keys[0];};
  const maxT=clamp(1+Math.floor(Math.log2(Math.max(1,budget/10))),1,5),h=HALF();
  const rows={barricade:[h-2,h-3],melee:[h-1,h-2,h-3],tower:[h-3,h-4,h-5],ranged:[h-4,h-5,h-3],frost:[h-4,h-5],healer:[h-5,h-6],sniper:[h-7,h-8,h-6],mortar:[h-8,h-9,h-7]};
  const cols=[...Array(N).keys()];let left=budget,guard=0;
  while(left>=1&&guard++<3000){const line=pick();let t=Math.min(maxT,1+Math.floor(Math.pow(R(),0.7)*maxT));while(t>1&&PTS(t)>left)t--;
    let spot=null;const order=cols.slice().sort((a,b)=>Math.abs(a-N/2)-Math.abs(b-N/2)+(R()-0.5)*N*0.9);
    for(const r of rows[line]){if(spot)break;if(r<0)continue;for(const c of order){if(!taken.has(r*N+c)&&canPlace(c,r,'enemy')){spot=[c,r];break;}}}
    if(!spot){for(let r=h-1;r>=0&&!spot;r--)for(const c of order){if(!taken.has(r*N+c)&&canPlace(c,r,'enemy')){spot=[c,r];break;}}}
    if(!spot)break;taken.add(spot[1]*N+spot[0]);list.push({line,tier:t,c:spot[0],r:spot[1]});left-=PTS(t);}
  return list;}

  if(!force&&(sayGap>0||(u.sayCd||0)>time))return;if(bubbles.length>=(W<600?4:7))return;if(bubbles.some(b=>b.u===u))return;

    if(LL&&LL[cat]&&Math.random()<0.6)list=LL[cat];if(H&&list)list=list.filter(p=>!FANTASY_ONLY.test(p));}

/* ---------- ИИ героев ---------- */

function enemyUpdate(e,dt){
  e.flash-=dt;e.knock*=Math.exp(-14*dt);e.cdLeft-=dt;e.sq*=Math.exp(-9*dt);if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slowF=0;}

      if(t.alive){say(e,t.kind==='castle'?'castle':'attack',t.kind==='castle'?0.03:0.008);if(e.line==='melee'){if(distT(e,t)<=e.range+0.4*G)damage(e,t,e.dmg);}else fire(e,t,'arrow',e.dmg,0,0,8);}}
    if(A.t>=A.dur)e.atk=null;return;}
  e.retarget-=dt;

    if(castle&&castle.alive&&distRect(e,castle)<=e.range+0.05)e.target=castle;
    else{let bd=e.line==='melee'?1.1*G:e.range;for(const h of TEAMS.ally){if((h.kind!=='hero'&&h.kind!=='bear')||!h.alive)continue;const d=distT(e,h);if(d<bd){bd=d;e.target=h;}}}}
  const t=e.target,sp=e.spd*(1-e.slowF)*dt;e.moving=false;

    if(d<=e.range){if(e.cdLeft<=0){e.atk={t:0,dur:e.line==='melee'?0.34:0.3,hit:0.5,target:t,done:false};e.cdLeft=e.cd;e.sq=-0.6;}return;}
    if((t.kind==='hero'||t.kind==='bear')&&d<2.5*G){const l=Math.hypot(t.x-e.x,t.y-e.y)||1;e.x+=(t.x-e.x)/l*sp;e.y+=(t.y-e.y)/l*sp;e.moving=true;e.walk+=dt;return;}
    e.target=null;}
  if(!castle)return;

function castleUpdate(C,dt){if(!C||!C.alive)return;C.flash-=dt;C.cdLeft-=dt;if(C.cdLeft>0)return;
  const cy=C.team==='ally'?C.y0+0.2:C.y1-0.2;let best=null,bd=C.range;for(const e of TEAMS[foeTeam(C.team)]){if(!e.alive)continue;const d=distRect(e,C);if(d<bd){bd=d;best=e;}}
  if(best){C.cdLeft=0.6;for(const x of[C.x0+0.5,C.x1-0.5])fire({x,y:cy,team:C.team,kind:'castle',face:1},best,'arrow',C.dmg,0,0,22);}}

/* ---------- главный шаг ---------- */
function update(dt){

  if(S.phase==='run'){const B=S.B;runT+=dt;

      if(B.dir==='waves'){waveT+=dt;if(waveT>=20){waveT=0;const o=['top','bottom','left','right'].filter(x=>x!==spawnSide);spawnSide=o[Math.random()*3|0];announce();}}}
    else if(B.btype==='defend'){waveTick(dt);if(bank>0&&enemies.length<ENEMY_CAP)spawnBatch(0);}
    if(CAST.ally){flowCd-=dt;if(flowDirty&&flowCd<=0){computeFlow();flowCd=0.5;}}
    TEAMS.ally=heroes.filter(h=>h.alive&&h.team==='ally');TEAMS.enemy=enemies.filter(e=>e.alive).concat(heroes.filter(h=>h.alive&&h.team==='enemy'));UNITS.a=TEAMS.ally.length;UNITS.e=TEAMS.enemy.length;
    bears=bears.filter(b=>b.alive);if(bears.length){TEAMS.ally.push(...bears);TEAMS.enemy.push(...bears);}rkStep(dt);
    sayGap-=dt;for(const b of bubbles){b.life-=dt;if(b.u&&b.u.alive){b.x=b.u.x;b.y=b.u.y;b.sc=b.u.sc||1;}}bubbles=bubbles.filter(b=>b.life>0);
    for(const h of heroes)if(h.alive)heroUpdate(h,dt);
    if(ADV.ally||ADV.enemy){const HB=new Map();for(const h of heroes){if(!h.alive||h.s.struct)continue;const k=Math.floor(h.y/G)*64+Math.floor(h.x/G);let a=HB.get(k);if(!a)HB.set(k,a=[]);a.push(h);}
      for(const a of HB.values())for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const p=a[i],q=a[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||0.01,m=0.45*G;if(d<m){const s=(m-d)*0.4;p.x-=dx/d*s;p.y-=dy/d*s;q.x+=dx/d*s;q.y+=dy/d*s;}}

    const Bm=new Map();for(const e of enemies){if(!e.alive)continue;const k=(Math.floor(e.y)+2)*(N+8)+Math.floor(e.x)+2;let a=Bm.get(k);if(!a)Bm.set(k,a=[]);a.push(e);}

      e.x=clamp(e.x,0.2,N-0.2);e.y=clamp(e.y,0.2,N-0.2);}

  for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;
    if(p.drag){const f=Math.exp(-p.drag*dt);p.vx*=f;p.vy*=f;}
    if((p.k==='px'||p.k==='coin'||p.k==='conf')&&p.ground!=null&&p.y>p.ground){p.y=p.ground;p.vy*=-0.35;p.vx*=0.55;p.vr*=0.5;if(Math.abs(p.vy)<6*SP){p.vy=0;p.g=0;p.vx*=0.8;p.vr=0;}}

  parts=parts.filter(p=>p.life>0);

function suddenDeath(dt){const B=S.B;if(endT>=0)return;
  const lim=B.btype==='photovs'?120:(B.btype==='fortress'||B.btype==='friend')?180:0;if(!lim||runT<lim)return;
  if(!sdOn){sdOn=true;floats.push({x:AW/2,y:AH/2,txt:'Внезапная смерть!',life:2,max:2,c:'#fca5a5',big:true});toast('Внезапная смерть: все слабеют, пока кто-то не падёт');}
  for(const h of heroes){if(!h.alive)continue;h.hp-=h.maxHp*0.03*dt;crumble(h,2);if(h.hp<=0)kill(h);}

function checkEnd(){if(endT>=0)return;const B=S.B,a=UNITS.a,e=UNITS.e,nb=bears.filter(b=>b.alive).length;let res=null,why='';
  if(nb&&!a&&!e&&B.btype!=='endless'){S.result='draw';S.why='Мармеладные медведи съели всех. Победа не засчитана';endT=1.8;return;}

  if(res==='win'&&nb){if(!S.bearMsg){S.bearMsg=1;toast('Осталось победить мармеладных медведей!');}return;}
  if(res){S.result=res;S.why=why;endT=1.8;}}

function drawProj(p){

    lines.push(`Опыт: +${fmt(gain)}`);if(S.level>oldL){lines.push(`Новый уровень ${S.level}! Замок в бесконечном режиме стал крепче`);SND.lvl();}

  const P=RKP[R.id],stat=!mx?'':P.r?`Радиус ${P.r[lv-1].toFixed(1)} · урон ${fmt(P.d[lv-1])}`:R.id==='gold'?`Слитков: ${P.n[lv-1]} · взрыв ${fmt(P.d[lv-1])}`:R.id==='plague'?`Крыс: ${P.n[lv-1]} · укус ${fmt(P.d[lv-1])}`:`Медведей: ${P.n[lv-1]} · прочность ${fmt(P.hp[lv-1])}`;
  bar.innerHTML=`<div class="rktitle">${ic('rocket','','#ff7a59')}<b>Ракеты</b><span class="rkcnt">${RK.unl?'без ограничений':`${ic('dice')} ${RK.rand} ${ic('target')} ${RK.aim}`}</span></div>
    <div class="rkrow"></div>
    ${mx?`<div class="rkinfo"><b>${esc(R.name)}</b> — ${esc(R.desc)}. <span>${stat}. Бьёт по всем.</span></div>
    <div class="rklvs">${[1,2,3,4,5].map(k=>`<button class="${k===lv?'sel':''} ${k>mx?'off':''}" data-k="${k}" title="Уровень ${k}">${k>mx?ic('lock'):k}</button>`).join('')}</div>
    <div class="rkgo"><button class="px gold" id="rkRand" ${!RK.unl&&RK.rand<=0?'disabled':''}>${ic('dice')} Случайно</button><button class="px red" id="rkAim" ${!RK.unl&&RK.aim<=0?'disabled':''}>${ic('target')} В цель</button></div>`
    :`<div class="rkinfo">Ракеты открываются победами в сюжете: первая вселенная даёт обычную ракету, каждая следующая — новый вид. Каждая победа усиливает ракету</div>`}`;
  const row=bar.querySelector('.rkrow');
  ROCKETS.forEach((Rr,k)=>{const l=av.lv[k],b=document.createElement('button');b.className='rkb'+(l?'':' locked')+(k===i&&l?' sel':'');b.title=Rr.name;const cv2=document.createElement('canvas');cv2.width=cv2.height=64;cv2.getContext('2d').drawImage(rocketIcon(k,64),0,0);b.appendChild(cv2);
    b.insertAdjacentHTML('beforeend',l?`<i class="rklv">${l}</i>`:ic('lock','rklock'));b.onclick=()=>{SND.click();if(!l){toast(`${Rr.name}: откроется победой во вселенной «${UNIVERSES[k].name}»`);return;}rkOpen=k;rkBar();};row.appendChild(b);});
  bar.querySelectorAll('.rklvs button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k>mx)return toast(`Уровень ${k} откроется следующими победами`);SND.click();rkLv[i]=k;rkBar();});
  const rr=bar.querySelector('#rkRand');if(rr)rr.onclick=()=>{if(S.phase!=='run')return toast('Дождитесь начала боя');if(!RK.unl){if(RK.rand<=0)return;RK.rand--;}const[x,y]=rkRandomTarget();launchRocket(i,lv,x,y);rkBar();};
  const ra=bar.querySelector('#rkAim');if(ra)ra.onclick=()=>{if(S.phase!=='run')return toast('Дождитесь начала боя');if(!RK.unl&&RK.aim<=0)return;S.aim={ti:i,lvl:lv};aimBanner();rkBar();};}
function aimBanner(){const el=$('aimBan');document.body.classList.toggle('aiming',!!(S.aim&&S.phase==='run'));if(!S.aim||S.phase!=='run'){el.classList.add('hide');return;}el.classList.remove('hide');
  el.innerHTML=`${ic('target')}<span>Нажмите на поле, куда ударить</span><button class="px grey sm" title="Отмена">${ic('clear')}</button>`;el.querySelector('button').onclick=()=>{S.aim=null;aimBanner();rkBar();};}
function fireAim(x,y){if(!S.aim)return;if(!RK.unl){if(RK.aim<=0){S.aim=null;aimBanner();return;}RK.aim--;}launchRocket(S.aim.ti,S.aim.lvl,clamp(x,0.3,N-0.3),clamp(y,0.3,N-0.3));S.aim=null;aimBanner();rkBar();}
function rkUnlockAfterWin(B,st){if(B.ui>=ROCKETS.length)return null;const R=ROCKETS[B.ui],old=S.rk[R.id]||0,nv=Math.min(5,st.done);if(nv<=old)return null;S.rk[R.id]=nv;
  return old?`${R.name} усилена до уровня ${nv}`:`Открыта новая ракета: ${R.name}! Её можно запускать в бою`;}

/* ---------- панель лимитов и уровни карточек ---------- */
function tierCounts(L){const by={};for(const u of L){(by[u.line]=by[u.line]||[0,0,0,0,0,0])[u.tier]++;}return by;}
function limitsPanel(){const el=$('limits'),B=S.B;if(!B||S.phase!=='prep'||(B.mode==='photo')){el.classList.add('hide');return;}el.classList.remove('hide');
  const L=ARMY(),used=usedPts(),lim=budget(),fin=lim<Infinity,f=fin?Math.min(1,used/lim):0,tc=[0,0,0,0,0,0];L.forEach(u=>tc[u.tier]++);
  const col=!fin?'#7dd3fc':f>=1?'#ffd23f':f>0.8?'#ffb13c':'#2ee6a6';
  el.innerHTML=`<div class="limtop">${ic('swords')}<b>Сила армии</b><span class="limnum" style="color:${col}"><b>${used}</b>${fin?` / ${lim}`:''}</span></div>
    ${fin?`<div class="limbar"><i style="width:${f*100}%;--lc:${col}"></i>${Array.from({length:9},(_,k)=>`<s style="left:${(k+1)*10}%"></s>`).join('')}</div>
    <div class="limsub">${f>=1?'Предел! Сливайте одинаковых бойцов, чтобы стать сильнее':`Свободно ${lim-used} очк. Боец ур. 1 = 1, ур. 2 = 2, ур. 3 = 4, ур. 4 = 8, ур. 5 = 16`}</div>`:'<div class="limsub">Без лимита</div>'}
    <div class="tiers">${[1,2,3,4,5].map(t=>`<span class="tier t${t} ${tc[t]?'':'zero'}"><em>${t}</em><b>${tc[t]}</b></span>`).join('')}</div>`;}
function cardLevels(card,line){const by=tierCounts(ARMY())[line];const old=card.querySelector('.lvls');if(old)old.remove();if(!by)return;
  const sp=document.createElement('span');sp.className='lvls';sp.innerHTML=[5,4,3,2,1].filter(t=>by[t]).slice(0,3).map(t=>`<i class="t${t}">${t}</i>×${by[t]}`).join(' ');card.appendChild(sp);}

/* ---------- вкладки и анализ ---------- */
let sideTab='army';
function tabsBar(){const B=S.B,on=!!(B&&B.mode==='camp'&&S.phase==='prep');const t=$('tabs');t.classList.toggle('hide',!on);if(!on&&sideTab!=='army'){sideTab='army';}
  t.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===sideTab));$('shop').classList.toggle('hide',sideTab!=='army');$('anal').classList.toggle('hide',sideTab!=='anal');if(sideTab==='anal')analPanel();}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{SND.click();sideTab=b.dataset.tab;tabsBar();});
function armyPower(L,mult){const m=mult||1,o={dps:0,hp:0,far:0,heal:0,aoe:0,struct:0,mobile:0,n:L.length,anti:0,lines:{}};
  for(const u of L){const s=heroStats(u.line,u.tier),sh=s.shots||1,d=s.dmg/(s.cd||1)*sh*m,aoe=s.aoe?1.7:1;o.dps+=d*aoe;o.hp+=s.hp*m;if(s.range>=3)o.far+=d*aoe;if(s.aoe)o.aoe+=d*aoe;o.heal+=(s.heal||0)/(s.cd||1)*m;
    if(HERO[u.line].struct)o.struct++;else o.mobile++;if(u.line==='mortar'||u.line==='sniper')o.anti+=d;o.lines[u.line]=(o.lines[u.line]||0)+1;}return o;}
function analyze(){const B=S.B,L=S.army,me=armyPower(L),tips=[],d=B.d||1;let foe,foeName='Армия врага',blind=!!B.blind;
  if(B.btype==='defend'){const total=campBudget(d)*2.1*(0.85+0.1*B.level),n=2+B.level,big=total/n*1.4,bm=B.botMult||1;
    foe={dps:big*(0.78*6+0.22*5/1.3)*bm,hp:big*(0.78*40+0.22*28)*bm,far:big*0.22*5/1.3*bm,heal:0,aoe:0,struct:0,mobile:big,n:Math.round(big),anti:0,lines:{}};foeName='Самая большая волна';}
  else foe=armyPower(S.army2,B.botMult||1);
  const [ch,cd]=castleSpec('enemy'),[ah]=castleSpec('ally');
  let myHP=me.hp+Math.min(me.hp*0.6,me.heal*30),myDPS=me.dps,foeHP=foe.hp,foeDPS=foe.dps;
  if(B.btype==='defend')myHP+=ah*0.5;
  if(B.btype==='attack'){foeHP+=ch*0.6;foeDPS+=cd*2/0.6*0.5;}
  if(B.btype==='fortress'){foeHP+=ch*0.3;myHP+=ah*0.3;}
  const adv=(myHP*myDPS+1)/(foeHP*foeDPS+1);let score=clamp(Math.round(50+22*Math.log2(adv)),0,100);
  const lim=budget(),used=usedPts(L);
  if(!L.length){score=0;tips.push(['bad','Армия пуста: выберите бойцов в «Армии» и поставьте их на поле']);}
  if(lim<Infinity&&used<lim*0.85&&L.length)tips.push(['warn',`Свободно ${lim-used} очков силы: поставьте ещё бойцов`]);
  let pairs=0;const tc=tierCounts(L);for(const l in tc)for(let t=1;t<5;t++)pairs+=Math.floor(tc[l][t]/2);
  if(pairs)tips.push(['tip',`Есть пары одинаковых бойцов (${pairs}). Слейте их — получите более сильных и освободите клетки`]);
  if(!blind&&B.btype!=='defend'){if(foe.struct>=2&&!me.anti)tips.push(['warn','У врага постройки. Миномёт или снайпер бьют их издалека']);}
  if(foe.n>=12&&me.aoe<me.dps*0.15&&L.length)tips.push(['warn','Врагов много. Добавьте бойцов с ударом по области: миномёт, мороз 4+ уровня или мага']);
  if(!me.lines.healer&&L.length>=6)tips.push(['tip','Лекарь сзади продлит жизнь армии и починит крепость']);
  if(B.btype==='attack'&&me.n&&me.struct/me.n>0.4)tips.push(['bad','В штурме постройки стоят на месте: башни, баррикады и миномёты не дойдут до вражеской крепости']);
  if(B.btype==='defend'&&!me.lines.barricade&&L.length>=4)tips.push(['tip','Баррикада на пути врагов задержит волну под огнём ваших стрелков']);
  if(me.far<me.dps*0.25&&L.length>=4)tips.push(['tip','Мало дальнего боя: стрелки и башни бьют до того, как враг подойдёт']);
  const avg=(ls)=>{const a=L.filter(u=>ls.includes(u.line));return a.length?a.reduce((s,u)=>s+u.r,0)/a.length:null;},rM=avg(['melee','barricade']),rR=avg(['ranged','sniper','healer','mortar','frost']);
  if(rM!=null&&rR!=null&&rR<rM-0.5)tips.push(['warn','Стрелки и лекари стоят впереди бойцов ближнего боя. Поставьте их за спинами']);
  const lone=L.filter(u=>u.line==='healer'&&!L.some(o=>o!==u&&Math.hypot(o.c-u.c,o.r-u.r)<=HERO.healer.range*G+0.5));if(lone.length)tips.push(['warn','Лекарю некого лечить: рядом нет своих бойцов']);
  if(B.btype==='fortress'){const own=castleRect('ally'),near=L.filter(u=>u.r>=own.y0-4).length;if(!near&&L.length>=4)tips.push(['warn','Крепость без охраны: оставьте у неё пару бойцов']);}
  if(blind)tips.unshift(['info','Бой вслепую: армию врага не видно, сравнение по силе недоступно']);
  if(!tips.length)tips.push(['good','Расстановка выглядит крепкой. В бой!']);
  const rows=[['Урон в секунду',me.dps,foe.dps],['Запас здоровья',me.hp,foe.hp],['Дальний бой',me.far,foe.far],['Удар по области',me.aoe,foe.aoe],['Лечение',me.heal,foe.heal]];
  return{score:blind?null:score,rows,foeName,tips,blind,used,lim};}
function gaugeSVG(v){const a=Math.PI*(1-v/100),x=50+38*Math.cos(a),y=54-38*Math.sin(a),lbl=v<30?'Слабо':v<50?'Рискованно':v<70?'Неплохо':v<85?'Хорошо':'Отлично',c=v<30?'#ff5d6c':v<50?'#ffb13c':v<70?'#ffd23f':'#2ee6a6';
  const arc=(f0,f1,col)=>{const a0=Math.PI*(1-f0),a1=Math.PI*(1-f1);return `<path d="M${50+38*Math.cos(a0)} ${54-38*Math.sin(a0)}A38 38 0 0 1 ${50+38*Math.cos(a1)} ${54-38*Math.sin(a1)}" stroke="${col}" stroke-width="11" fill="none"/>`;};
  return `<svg viewBox="0 0 100 66" class="gauge"><path d="M12 54A38 38 0 0 1 88 54" stroke="${IK}" stroke-width="16" fill="none" stroke-linecap="round"/>${arc(0,0.3,'#ff5d6c')}${arc(0.3,0.5,'#ffb13c')}${arc(0.5,0.7,'#ffd23f')}${arc(0.7,1,'#2ee6a6')}
    <line x1="50" y1="54" x2="${x}" y2="${y}" stroke="${IK}" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="54" x2="${x}" y2="${y}" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="50" cy="54" r="5.5" fill="#fff" stroke="${IK}" stroke-width="2.5"/>
    <text x="50" y="40" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" stroke="${IK}" stroke-width="3" paint-order="stroke">${v}</text></svg><div class="glbl" style="color:${c}">${lbl}</div>`;}
function analPanel(){const el=$('anal'),A=analyze();const TI={bad:['cross','#ff5d6c'],warn:['bolt','#ffb13c'],tip:['star','#ffd23f'],good:['check','#2ee6a6'],info:['eyeOff','#9fb4ff']};
  el.innerHTML=`<div class="anbox">${A.score!=null?`<div class="gwrap">${gaugeSVG(A.score)}<small>Насколько армия готова к этому бою</small></div>`:`<div class="gwrap blindg">${ic('eyeOff','huge')}<small>Враг скрыт</small></div>`}
    <div class="cmp"><div class="cmph"><span class="me">Вы</span><span class="foe">${esc(A.foeName)}</span></div>${A.rows.map(([n,a,b])=>{const m=Math.max(a,A.blind?a:b,1);return `<div class="cmpr"><small>${n}</small><div class="cb"><i class="me" style="width:${a/m*100}%"></i><em>${fmt(a)}</em></div>${A.blind?'':`<div class="cb"><i class="foe" style="width:${b/m*100}%"></i><em>${fmt(b)}</em></div>`}</div>`;}).join('')}</div></div>
    <div class="tips">${A.tips.map(([k,t])=>`<div class="tipr ${k}">${ic(TI[k][0])}<span>${esc(t)}</span></div>`).join('')}</div>
    ${!A.blind&&S.B.btype!=='defend'?'<div class="hint3">Красные круги на поле — зоны обстрела вражеских стрелков и построек</div>':''}`;}
function drawThreat(){const B=S.B;if(sideTab!=='anal'||!B||B.mode!=='camp'||B.blind||S.phase!=='prep')return;
  for(const u of S.army2){const s=heroStats(u.line,u.tier);if(!(s.range>2))continue;const x=(u.c+0.5)*CS,y=(u.r+0.5)*CS,R=s.range*G*CS;ctx.fillStyle='rgba(255,70,90,0.07)';ctx.beginPath();ctx.arc(x,y,R,0,6.283);ctx.fill();ringW(x,y,R,'rgba(255,90,110,0.55)');}}

/* ---------- телефон: iPhone и установка на экран ---------- */
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window&&!/claude\.ai|claudeusercontent/.test(location.host))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
function iosTip(){try{const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(!ios||standalone||window.top!==window||localStorage.getItem('pl-iostip'))return;const d=document.createElement('div');d.id='iosTip';
  d.innerHTML=`<svg class="shr" viewBox="0 0 24 24" fill="none" stroke="#2b6fd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg><span>Играйте как в приложении: нажмите <b>«Поделиться»</b> внизу Safari, затем <b>«На экран „Домой“»</b></span><button class="px grey sm" title="Закрыть">${ic('clear')}</button>`;
  d.querySelector('button').onclick=()=>{try{localStorage.setItem('pl-iostip','1');}catch(e){}d.remove();};document.body.appendChild(d);setTimeout(()=>d.isConnected&&d.remove(),20000);}catch(e){}}
/* ---------- старт ---------- */
paintIcons();
load();new ResizeObserver(()=>layout()).observe(stage);
if(document.fonts&&document.fonts.load){document.fonts.load('800 12px Rubik').catch(()=>{});}
showMenu();requestAnimationFrame(frame);setTimeout(iosTip,1500);
window.__game={S,startBattle,mergeAll,place,toPrep,showMenu,go,heroes:()=>heroes,enemies:()=>enemies,castles:()=>CAST,PIC:()=>PIC,launchRocket,bears:()=>bears,rats:()=>rats,bars:()=>bars,RK:()=>RK,analyze,
  cellScreen:(c,r)=>{const b=cv.getBoundingClientRect();return[b.left+offX+((c+0.5)*CS)*scale,b.top+offY+((r+0.5)*CS)*scale];}};
